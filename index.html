@font-face{font-family:'Fraunces Fallback';font-style:italic;src:local('Times New Roman Italic'),local('TimesNewRomanPS-ItalicMT'),local('Liberation Serif Italic');size-adjust:107.9%;ascent-override:90.6%;descent-override:23.6%;line-gap-override:0%}
@font-face{font-family:'Instrument Fallback';src:local('Arial'),local('Liberation Sans'),local('Helvetica Neue');size-adjust:101.8%;ascent-override:95.3%;descent-override:24.6%;line-gap-override:0%}
:root{
  /* motion: 4 curvas, 4 duraciones */
  --e-out:cubic-bezier(.16,1,.3,1);      /* asentar: todo lo que entra */
  --e-in:cubic-bezier(.5,0,.75,0);       /* soltar: todo lo que sale */
  --e-io:cubic-bezier(.65,0,.35,1);      /* transformar: cielo, sol, panel */
  --e-spring:cubic-bezier(.34,1.56,.64,1);/* rebotar: press, sol, unidades */
  --d-fast:140ms; --d-base:320ms; --d-slow:720ms; --d-sky:1600ms;
  /* espacio 4/8 y radios */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --r-s:12px;--r-m:16px;--r-l:24px;--r-pill:999px;--hl:1px;
  /* tema (arranca en noche: el cielo «amanece» sobre esto) */
  --fg:#f6f2ea;--muted:rgba(246,242,234,.86);--hair:rgba(246,242,234,.16);
  --card:rgba(12,16,34,.3);--cardBorder:rgba(255,255,255,.14);
  --chip:rgba(8,12,28,.22);--chipHover:rgba(8,12,28,.34);--chipPress:rgba(8,12,28,.46);
  --accent:#f5c46a;--accentText:#fbdda0;--accentSoft:rgba(245,196,106,.16);
  --vw:520;--pw:380;--bs:clamp(56px,18.5vw,84px);
  --serif:'Fraunces','Fraunces Fallback',Georgia,serif;
  --sans:'Instrument Sans','Instrument Fallback',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@supports (transition-timing-function:linear(0,1)){:root{--e-spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017,1.077 20.4%,1.121,1.149 24.3%,1.159,1.163,1.161 27.5%,1.154 29.1%,1.129 32.3%,1.051 39.6%,1.017 43.1%,.991,.977 51%,.974 53.8%,.975 57.1%,.997 69.8%,1.003 76.9%,1.004 83.8%,1)}}
@media (min-resolution:2dppx){:root{--hl:.5px}}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;overflow-x:hidden}
html,body{margin:0;padding:0;background:#0b1430}
body{min-height:100%;font-family:var(--sans);color:var(--fg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-kerning:normal;overflow-x:hidden;overflow-x:clip;transition:color var(--d-slow) var(--e-io)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input{font:inherit;color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.u{margin-left:.14em}

/* ---------- cielo ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.sky-layer{position:absolute;inset:0;opacity:0;transition:opacity var(--d-sky) var(--e-io)}
.sky-layer.on{opacity:1}
.glow{position:fixed;left:0;top:0;width:110vmax;height:110vmax;border-radius:50%;pointer-events:none;z-index:0;opacity:0;will-change:transform;
  transform:translate3d(calc(var(--gx,0)*1px - 50%),calc(var(--gy,0)*1px - 50%),0);transition:opacity var(--d-sky) var(--e-io)}
#fx{position:fixed;inset:0;z-index:1;pointer-events:none;width:100%;height:100%}
.flash{position:fixed;inset:0;z-index:1;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}6%{opacity:.22}12%{opacity:.03}18%{opacity:.14}100%{opacity:0}}
.grain{position:fixed;inset:0;z-index:2;pointer-events:none;background-size:128px 128px}

/* ---------- estructura ---------- */
.app{position:relative;z-index:3;max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(var(--s3) + env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) calc(var(--s4) + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);animation:fadeDown var(--d-slow) var(--e-out) both}
.chipbtn{display:inline-flex;align-items:center;gap:var(--s2);min-height:44px;border-radius:var(--r-pill);background:var(--chip);
  box-shadow:inset 0 0 0 var(--hl) var(--hair);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  transition:background var(--d-base) ease,transform .5s var(--e-spring),opacity var(--d-base) ease}
@media (hover:hover){.chipbtn:hover{background:var(--chipHover)}}
.chipbtn:active{background:var(--chipPress);transform:scale(.955);transition:background var(--d-fast) ease,transform var(--d-fast) var(--e-out)}
.chipbtn:disabled,.chipbtn[aria-disabled=true]{opacity:.45;pointer-events:none}
.loc{min-width:0;flex:0 1 auto;padding:0 14px 0 12px}
header.tight .clock em{display:none}
.loc span{font-size:15px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc svg{flex:none}
.loc .chev{opacity:.6;transition:transform var(--d-base) var(--e-out)}
.loc[aria-expanded=true] .chev{transform:rotate(180deg)}
.clock{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:var(--s2);white-space:nowrap;flex:none}
.clock i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s ease-in-out infinite}
.clock em{font-family:var(--serif);font-style:italic;font-weight:400;font-size:15px;font-variation-settings:'opsz' 15,'SOFT' 50,'WONK' 0;color:var(--fg);opacity:.92;margin-right:2px;animation:fadeIn var(--d-slow) var(--e-out) both}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

/* ---------- escenario: arco del día ---------- */
.stage{position:relative;width:100%;aspect-ratio:400/150;max-height:21vh;margin-top:var(--s2)}
.stage-in{position:absolute;inset:0;will-change:transform}
.stage svg.arc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.arc path{fill:none;stroke:var(--fg);stroke-width:1.4;stroke-dasharray:.01 7;stroke-linecap:round;vector-effect:non-scaling-stroke;transition:stroke var(--d-slow) var(--e-io)}
.arc .base{stroke-opacity:.2}.arc .done{stroke-opacity:.5}
.arc-label{position:absolute;z-index:2;bottom:-4px;display:flex;align-items:center;gap:var(--s1);font-size:12px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;opacity:0;transition:opacity var(--d-slow) ease}
.arc-label.l{left:0}.arc-label.r{right:0}
.arc-label svg{flex:none;opacity:.9}
.stage.ready .arc-label.show{opacity:1}
.body{position:absolute;left:0;top:0;width:var(--bs);aspect-ratio:1;cursor:pointer;-webkit-tap-highlight-color:transparent;
  transform:translate3d(calc(var(--bx,0)*1px - 50%),calc(var(--by,0)*1px - 50%),0);transition:opacity var(--d-slow) var(--e-io)}
.orb{position:absolute;inset:0}
.body.poke .orb{animation:poke .9s var(--e-spring)}
@keyframes poke{0%{transform:scale(1)}18%{transform:scale(.86)}100%{transform:scale(1)}}
.sun{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 34%,#fff8d6 0%,#ffdc74 36%,#ffb63e 76%,#f69a2e 100%);animation:breathe 7s ease-in-out infinite}
.sun-halo{position:absolute;inset:-70%;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.5) 0%,rgba(255,200,90,.16) 38%,rgba(255,200,90,0) 68%);animation:breathe 7s ease-in-out infinite}
.rays{position:absolute;inset:-36%;animation:spin 120s linear infinite}
.rays g{transform-origin:50% 50%;transition:transform 1.1s var(--e-spring)}
.rays line{stroke:#ffc95e;stroke-width:2.6;stroke-linecap:round;opacity:.9}
.moon{position:absolute;inset:6%;border-radius:50%;box-shadow:inset calc(var(--bs)*.24) calc(var(--bs)*-.12) 0 0 #f4eedb;transform:rotate(-12deg);animation:breathe 9s ease-in-out infinite}
.moon-halo{position:absolute;inset:-60%;border-radius:50%;background:radial-gradient(circle,rgba(220,228,255,.26) 0%,rgba(220,228,255,0) 62%);animation:breathe 9s ease-in-out infinite}
/* sol tras las nubes: disco pálido, sin rayos ni halo cálido */
.body.veil .sun{background:radial-gradient(circle at 40% 36%,#fff 0%,#f6f1e2 60%,#e9e3d2 100%)}
.body.veil .rays{opacity:0}.body.veil .sun-halo{background:radial-gradient(circle,rgba(255,255,255,.4) 0%,rgba(255,255,255,0) 60%)}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
.clouds{position:absolute;inset:0;pointer-events:none;will-change:transform}
.cloud{position:absolute;transition:opacity var(--d-slow) var(--e-io)}
.cloud svg{display:block;width:100%;height:auto;overflow:visible}
.cloud .drift{animation:drift var(--d,22s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(calc(var(--a,10px) * -1))}to{transform:translateX(var(--a,10px))}}
.haze{position:absolute;left:-10%;right:-10%;height:12%;border-radius:999px;background:currentColor;opacity:.2;filter:blur(8px);animation:drift 14s ease-in-out infinite alternate}

/* ---------- héroe ---------- */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:var(--s2) 0 var(--s4);min-height:0}
.verdict{font-family:var(--serif);font-weight:var(--vw);font-variation-settings:'opsz' 144,'SOFT' 100,'WONK' 1;font-kerning:none;line-height:.9;letter-spacing:-.045em;white-space:nowrap;margin:0;font-size:120px;display:flex;align-items:center;justify-content:center;padding-left:.06em;width:100%}
.verdict.dep{font-style:italic;letter-spacing:-.04em}
.verdict .ch{display:inline-block;white-space:pre;animation:rise var(--d-slow) var(--e-out) both}
.verdict .dot{color:var(--accent);transition:color var(--d-slow) var(--e-io)}
.verdict.out .ch{animation:sink var(--d-base) var(--e-in) both}
.meas{position:absolute!important;left:-9999px;top:0;visibility:hidden;display:inline-block!important;width:auto!important;padding:0!important;font-size:100px!important;white-space:pre}
@keyframes rise{from{opacity:0;transform:translateY(.3em) rotate(3deg);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes sink{to{opacity:0;transform:translateY(-.16em);filter:blur(6px)}}
.dots{display:flex;gap:10px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--fg);animation:shimmer 1.5s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
@keyframes shimmer{0%,100%{opacity:.22;transform:translateY(0)}45%{opacity:.9;transform:translateY(-4px)}}
.phrase{font-family:var(--serif);font-style:italic;font-weight:var(--pw);font-variation-settings:'opsz' 30,'SOFT' 50,'WONK' 0;letter-spacing:-.012em;font-size:clamp(21px,5.9vw,25px);line-height:1.28;
  max-width:min(100%,15.6em);margin:var(--s5) auto 0;min-height:2.56em;display:flex;align-items:flex-start;justify-content:center;hanging-punctuation:first}
.phrase .pi{display:block;text-wrap:balance}
.phrase .g{white-space:nowrap}
.phrase .w{display:inline-block;animation:wordIn var(--d-slow) var(--e-out) both}
.phrase.out .w{animation:wordOut var(--d-base) var(--e-in) both}
@keyframes wordIn{from{opacity:0;transform:translateY(.36em)}to{opacity:1;transform:none}}
@keyframes wordOut{to{opacity:0;transform:translateY(-.24em)}}
.actions{display:flex;gap:var(--s2);justify-content:center;margin-top:var(--s4)}
.pill{padding:0 var(--s4) 0 14px;font-size:14px;font-weight:500;letter-spacing:.002em}
.pill svg{flex:none;transition:transform var(--d-slow) var(--e-out)}
.pill.spin svg{transform:rotate(360deg)}
.pill.spin0 svg{transition:none;transform:none}
.temp-row{display:flex;align-items:center;justify-content:center;gap:var(--s4);margin-top:20px}
.temp{font-family:var(--serif);font-weight:340;font-variation-settings:'opsz' 72,'SOFT' 100,'WONK' 0;letter-spacing:-.035em;font-size:48px;line-height:1;font-variant-numeric:tabular-nums lining-nums;display:flex;align-items:flex-start;border-radius:var(--r-s);padding:var(--s1) 2px;margin:calc(var(--s1) * -1) -2px;transition:transform .5s var(--e-spring)}
.temp:active{transform:scale(.95);transition:transform var(--d-fast) var(--e-out)}
.temp .unit{font-family:var(--sans);font-size:max(13px,.27em);font-weight:600;letter-spacing:.02em;color:var(--muted);margin:7px 0 0 2px;display:inline-block;transition:transform .5s var(--e-spring)}
.temp.flip .unit{transform:rotateX(90deg);transition:transform var(--d-fast) var(--e-in)}
.mm{font-size:14px;color:var(--muted);text-align:left;line-height:1.43;font-variant-numeric:tabular-nums}
.mm b{color:var(--fg);font-weight:600}
.stagger{opacity:0;animation:up var(--d-slow) var(--e-out) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ---------- tarjeta ---------- */
.card{background:var(--card);border-radius:var(--r-l);padding:var(--s4) var(--s4) var(--s4);box-shadow:inset 0 0 0 var(--hl) var(--cardBorder);
  backdrop-filter:blur(20px) saturate(1.3);-webkit-backdrop-filter:blur(20px) saturate(1.3);transition:background var(--d-sky) var(--e-io),box-shadow var(--d-sky) var(--e-io)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s2);min-height:28px}
.label{font-size:13px;font-weight:500;color:var(--muted)}
.best{font-size:13px;font-weight:600;color:var(--accentText);background:var(--accentSoft);padding:5px 10px;border-radius:var(--r-pill);white-space:nowrap;font-variant-numeric:tabular-nums;transition:color var(--d-slow),background var(--d-slow)}
.best.none{color:var(--muted);background:transparent;padding-right:0;font-weight:500}
.hours{display:flex;overflow-x:auto;margin:0 calc(var(--s4) * -1);padding:0 var(--s4);scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding:0 var(--s4);overscroll-behavior-x:contain;
  --ml:#000;--mr:transparent;-webkit-mask-image:linear-gradient(90deg,var(--ml) 0,#000 20px,#000 calc(100% - 44px),var(--mr));mask-image:linear-gradient(90deg,var(--ml) 0,#000 20px,#000 calc(100% - 44px),var(--mr))}
.hours.mid{--ml:transparent}.hours.end{--ml:transparent;--mr:#000}.hours.fit{--mr:#000}
.hours::-webkit-scrollbar{display:none}
.hours{min-height:118px}.stats{min-height:38px}footer{min-height:calc(16px + var(--s3))}
.hr{flex:none;width:calc((100% + 0px) / 6.5);min-width:46px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:var(--s2) 0;border-radius:var(--r-s);scroll-snap-align:start;animation:up var(--d-slow) var(--e-out) both}
.hr.now{background:var(--nowbg,rgba(255,255,255,.1))}
.hr .t{font-size:12px;color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums;line-height:16px}
.hr.win .t{color:var(--accentText)}
.hr.now .t{color:var(--fg);font-weight:600}
.hr svg{display:block}
.hr .bar{width:4px;height:28px;border-radius:2px;background:var(--hair);position:relative;overflow:hidden}
.hr .bar i{position:absolute;inset:0;border-radius:2px;background:var(--muted);transform-origin:bottom;transform:scaleY(0);transition:transform var(--d-slow) var(--e-out)}
.hr.win .bar i,.hr.inwin .bar i{background:var(--accent)}
.hr .deg{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:16px;padding-left:.3em}
.hr .rp{font-size:11px;font-weight:500;color:var(--muted);line-height:12px;min-height:12px;font-variant-numeric:tabular-nums}
.hours.dry .rp{display:none}
.hours:not(.dry) .bar{height:20px}
.sep{height:var(--hl);background:var(--hair);margin:var(--s3) 0}
.stats{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:var(--s2);margin:0}
.stat{display:flex;flex-direction:column-reverse}
.stat dd{margin:0;font-size:17px;font-weight:600;letter-spacing:-.012em;font-variant-numeric:tabular-nums;line-height:20px;white-space:nowrap}
.stat dd small{font-size:12px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:2px}
.stat dt{font-size:12px;color:var(--muted);margin-top:2px;line-height:16px;white-space:nowrap}
footer{margin-top:var(--s3);padding-top:var(--s3);box-shadow:0 calc(var(--hl) * -1) 0 var(--hair);font-size:12px;color:var(--muted);line-height:16px;font-variant-numeric:tabular-nums}
footer a{color:inherit;text-decoration-thickness:var(--hl);text-underline-offset:3px;border-radius:4px}
.retry{margin-top:var(--s5);padding:0 var(--s4)}

/* ---------- panel de ubicación ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;transition:visibility 0s linear .5s}
.sheet-wrap.open{visibility:visible;transition:none}
.scrim{position:absolute;inset:0;background:rgba(8,12,22,.4);opacity:0;transition:opacity var(--d-base) ease}
.sheet-wrap.open .scrim{opacity:1}
.sheet{position:relative;width:100%;max-width:460px;background:#f8f5ef;color:#141b24;border-radius:28px 28px 0 0;
  padding:var(--s2) 20px calc(var(--s5) + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform var(--d-base) var(--e-in);touch-action:pan-y;
  --fg:#141b24;--muted:rgba(20,27,36,.68);--hair:rgba(20,27,36,.12)}

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let reduced=RM.matches; RM.addEventListener&&RM.addEventListener('change',e=>{reduced=e.matches;});
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ?cuando=2026-12-24T13:30 simula fecha y hora (para ver los guiños de calendario) */
const FAKE=Q.get('cuando')?Date.parse(Q.get('cuando')+'Z'):NaN;
const D_FAST=140,D_BASE=320,D_SLOW=720;

/* =================== copy =================== */
const TIER={perfect:'go',perfect_evening:'go',good:'go',night_clear:'go',hot:'dep',windy:'dep',cloudy_meh:'dep',night_meh:'dep',fog:'dep',cold:'no',rain:'no',snow:'no',storm:'no'};
const WORDS={
  go:['Sí','Venga','Abajo','Al lío','Es que sí','Dale','Olé','Por supuesto','Corre','Ya','Hecho','Te bajas'],
  no:['No','Ni hablar','Mejor no','Hoy no','Nanay','Quita','Ni loco','Para nada','Qué va','Ni en broma'],
  dep:['Depende','Psé','Regular','Bah','Según tú','Meh','Quizá','Tú verás','Hmm','A medias']
};
const PHRASES={
  perfect:['Día de manual: terraza, caña y a ver pasar a la gente.','El cielo se ha portado. No seas tú quien lo estropee.','Clima de anuncio de cerveza. Ya sabes lo que toca.','Ni una excusa aguanta ahí fuera. Terraza y punto.','Hoy el sol trabaja para ti. Baja a darle las gracias.','Si no bajas hoy, luego no te quejes en noviembre.','Cielo de postal y temperatura de catálogo. El resto lo pones tú.','Hay días que se piden solos. Este pide una caña.','Hasta el camarero sonríe hoy. Aprovecha.','Condiciones óptimas detectadas. Proceda a la terraza.','Esto es lo más cerca del cielo que vas a estar hoy. Baja.','Hace un día de los que se cuentan. Cuéntalo desde una mesa.','El parte de hoy cabe en dos palabras: mesa fuera.','Ni frío ni calor ni peros. Coge las llaves.'],
  perfect_evening:['Hora dorada y caña fría. La vida, de vez en cuando, acierta.','El sol se retira con estilo. Acompáñalo con una.','Atardecer de terraza. Verlo desde el sofá sería delito.','La luz está haciendo su mejor trabajo. Haz tú el tuyo: bajar.','Ese naranja del cielo combina con todo. Sobre todo con una caña.','Última luz del día. Que te pille sentado fuera.','El día se despide bonito. Despídelo tú con un vermú.','Cielo en modo filtro. Hoy las fotos salen solas.','Queda una hora de luz buena. Tú verás en qué la gastas.','El sol baja. Tú también deberías.','Atardece despacio, como se bebe la primera.','A esta luz todo el mundo sale guapo. Hasta la cuenta.'],
  good:['No es perfecto, pero se está de lujo. Baja tranquilo.','Se puede. Y, francamente, se debe.','Buena excusa para fingir que tenías plan.','El tiempo firma un notable. No pidas matrícula todos los días.','Chaqueta fina por si acaso y para abajo.','Hace bueno sin presumir. Lo justo para una ronda.','No hay excusa meteorológica. Las otras son cosa tuya.','Día apañado. De esos que mejoran con aceitunas.','El cielo cumple. Ahora te toca a ti.','Para ser hoy, está muy bien. Baja antes de que cambie.','Sin alardes, pero con terraza. Suficiente.','Buen rato a la vista. No lo dejes pasar por pereza.'],
  night_clear:['De noche también se vive. Caña bajo las estrellas.','Noche decente. Una… o las que hagan falta.','Buena noche para una terraza y una conversación larga.','El día se acabó; la terraza, no. Baja.','Cielo despejado y temperatura amable. La noche es joven.','Las estrellas ya están fuera. Tú todavía no.','Noche de terraza y de arreglar el mundo en una mesa.','Se está mejor fuera que dentro. Lo dice el termómetro.','La luna ha cogido mesa. Te guarda sitio.','Noche de las que alargan la última. Avisa en casa.','Hace una noche que ni encargada. Sal a verla.','El fresco justo para pedir otra. Qué casualidad.'],
  hot:['Calor de justicia. Terraza a la sombra o ni te asomes.','A esta hora hasta las moscas buscan sombra. Llévala helada.','Se puede, pero suda quien se lo gana. Bien fría o nada.','Bochorno del bueno. Sombra, tinto de verano y paciencia.','La caña se calienta antes de que digas «salud». Bebe rápido.','Busca toldo, ventilador o milagro. En ese orden.','Calor de chicharra. Solo si hay sombra y nebulizador.','El asfalto está para freír huevos. La silla metálica, también.','Terraza sí, pero la de la acera de la sombra.','Hoy el hielo es un bien de primera necesidad. Pide doble.','Sol sin piedad. Negocia con el camarero la mesa del toldo.','Espera a que afloje. La caña de las nueve sabe mejor.'],
  cold:['Hace un frío que pela. La caña, mejor dentro.','La terraza está libre; el problema eres tú tiritando.','Con este fresco: barra, calor de gente y a otra cosa.','Ni con manta. Deja la terraza para primavera.','Fuera hace frío de bufanda. Dentro hace caña.','Solo valen terrazas con estufa. Y aun así, con abrigo.','El frío no perdona. La barra, sí.','Se te va a enfriar hasta el café. Imagina la cerveza.','Hoy la terraza es deporte de riesgo. Quédate en la barra.','Día de caldo, no de caña. Y de puertas para dentro.','Con guantes no se pelan gambas. Piénsalo.','El vaho no cuenta como ambiente. Adentro.'],
  windy:['Sopla lo suyo. La servilleta acabará en otra provincia.','Con este aire la espuma no dura ni el brindis.','Viento traicionero. Sujeta bien el vaso, campeón.','Terraza sí, pero agárrate a la caña.','Hoy las sombrillas vuelan. Elige mesa con pared.','Viento de los que despeinan ideas. Mejor resguardado.','Las patatas de bolsa hoy van por libre. Avisado quedas.','Se puede, si no te importa perseguir el tique.','Aire con carácter. Pide algo que pese.','Pelo indomable y mantel volador. Tú decides.','Racha va, racha viene. Mesa al abrigo o nada.','Hoy el viento también quiere probar tu caña.'],
  rain:['Llueve. Hoy la única terraza es la de tu imaginación.','El cielo tiene otros planes. Barra techada y a esperar.','Ni lo intentes. Guarda esa cerveza para mejor ocasión.','Dentro se bebe igual de bien. Que no cunda el pánico.','Agua del cielo y agua en la caña: demasiada agua.','Día de bar con ventanas empañadas. Tiene su gracia.','Si tu terraza no tiene toldo, hoy no es tu terraza.','Las sillas están caladas. Tú no tienes por qué.','Paraguas y terraza nunca se han llevado bien.','Hoy la caña se toma mirando llover. Desde dentro.','Llueve sobre mojado. Literalmente. Quédate en la barra.','El parte dice agua. El plan dice barra.','Chaparrón en curso. La terraza puede esperar; tú, también.'],
  storm:['Hay tormenta. Ni terraza ni valentía mal entendida: dentro.','Truenos de fondo. La caña sabe mejor sin rayos cerca.','El cielo está de mal humor. Dale espacio.','Tormenta a la vista. Hoy el plan es barra y ventana.','Rayos, truenos y sombrillas metálicas. Haz cuentas.','Hoy el espectáculo se ve desde dentro. Con tapa.','El cielo se ha puesto dramático. No le sigas el juego.','Cuenta los segundos entre rayo y trueno. Desde la barra.','Ni el más valiente del barrio está fuera. Por algo será.','Tormenta de las serias. La terraza, ni mirarla.','Cuando escampe, hablamos. Ahora, a cubierto.','Jarrea con ganas. Ni un pie fuera.'],
  snow:['Está nevando. Como para terraza estás tú.','Nieve fuera, caña dentro. No hay más que hablar.','El único hielo de hoy cae del cielo. Métete dentro.','Paisaje de postal, terraza de pingüinos. Tú decides.','Hoy toca chocolate, no caña. Y dentro.','Las mesas tienen un dedo de nieve. Y subiendo.','Precioso para mirarlo. Desde el otro lado del cristal.','Nieva. La terraza hoy es de los muñecos.','Día de bota de agua y bar con calefacción.','Blanco por fuera, calentito por dentro. Así sí.','Haz la foto, sube el termostato y pide algo caliente.','Copos sí, cañas fuera no. Las normas son las normas.'],

/* Cada letra va en su caja para poder animarla, y eso rompe el kerning de la fuente.

function kern(chars,cls){

  const m=document.createElement('span'); m.className='verdict meas '+cls; $('hero').appendChild(m);

async function share(){
  if(!S.data||S.busy)return; S.busy=true; const btn=$('shareBtn'); btn.disabled=true; $('shareLabel').textContent='Un segundo…';
  const text='¿Terraza hoy en '+S.data.location+'? '+S.word+(/[\p{L}]$/u.test(S.word)?'. ':' ')+S.phrase, url='https://terrazahoy.com/';
  const reset=()=>{S.busy=false;btn.disabled=false;$('shareLabel').textContent='Compartir';};
  try{
    await fontsReady; const cv=shareImage(innerWidth>=1024?'og':'story');
    const blob=await new Promise(r=>cv.toBlob(r,'image/png')); const file=new File([blob],'terraza-hoy.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'¿Terraza hoy?',text:text+' '+url});}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='terraza-hoy.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
      let copied=false;try{await navigator.clipboard.writeText(text+' '+url);copied=true;}catch(e){}
      toast(copied?'Imagen descargada y texto copiado. A presumir.':'Imagen descargada. A presumir.',3000);}
  }catch(e){ if(!e||e.name!=='AbortError'){try{if(navigator.share)await navigator.share({title:'¿Terraza hoy?',text,url});else{await navigator.clipboard.writeText(text+' '+url);toast('Copiado. Pégalo en el grupo.');}}catch(_){}} }
  reset();
}
$('shareBtn').onclick=share;

/* en escritorio la temperatura acompaña a la tarjeta; en móvil, a la frase */
const DESK=matchMedia('(min-width:1024px) and (min-height:600px)');
function placeTemp(){const t=$('tempRow');if(DESK.matches){if(t.parentNode!==$('side'))$('side').prepend(t);}else if(t.parentNode!==$('hero'))$('hero').appendChild(t);}
DESK.addEventListener&&DESK.addEventListener('change',()=>{placeTemp();measureStage();fitVerdict();placeBody(curT);});
placeTemp();
function fitHeader(){const h=document.querySelector('header');h.classList.remove('tight');const l=$('locName');if(l.scrollWidth>l.clientWidth+1)h.classList.add('tight');}

/* =================== arranque =================== */
/* grano: tesela de ruido generada una vez; trama los degradados para que no hagan bandas */
let noiseTile=null;
(()=>{try{const n=document.createElement('canvas');n.width=n.height=128;const x=n.getContext('2d'),im=x.createImageData(128,128);
  for(let i=0;i<im.data.length;i+=4){const v=Math.random()<.5?0:255;im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=Math.random()*11;}
  x.putImageData(im,0,0);noiseTile=n;$('grain').style.backgroundImage='url('+n.toDataURL()+')';}catch(e){}})();
/* el veredicto no se enseña hasta tener su fuente (con tope): nunca se ve el salto de tipografía */
const fontsReady=(document.fonts&&document.fonts.load)?Promise.race([Promise.all([document.fonts.load("560 100px Fraunces"),document.fonts.load("italic 400 24px Fraunces"),document.fonts.load("500 14px 'Instrument Sans'")]),new Promise(r=>setTimeout(r,1400))]).catch(()=>{}):Promise.resolve();
document.fonts&&document.fonts.ready&&document.fonts.ready.then(()=>{fitVerdict();});
sizeFx(); measureStage(); placeBody(.02);
const sky=Q.get('sky');
if(sky&&SC[sky]){showLoading();fontsReady.then(()=>setTimeout(()=>{S.data=mock(sky);decide(true);render(true);},120));}
else{
  const cache=store.get('terraza_cache'), saved=store.get('terraza_loc');
  if(cache&&cache.d&&cache.loc&&Date.now()-cache.ts<27e5){   /* <45 min: se abre al instante con lo último y se refresca por detrás */
    S.loc=cache.loc; S.data=Object.assign(cache.d,{stale:true,stamp:cache.ts+(cache.d.offset||0)*1000});
    fontsReady.then(()=>{decide(true);render(true);fetchWeather(cache.loc,true);});
  } else { showLoading(); if(saved&&saved.lat!=null)fetchWeather(saved); else useMyLoc(false); }
  setInterval(()=>{if(S.loc&&!document.hidden)fetchWeather(S.loc,true);},6e5);
}
setInterval(()=>{if(S.data){const d=S.data,now=nowOf(d);$('clock').textContent=hm(now);if(!d.force&&!sunAnim){const ti=timeInfo(d,now);placeBody(Math.max(.02,Math.min(.98,ti.frac)));}}},3e4);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.loc&&S.data&&!S.data.force)fetchWeather(S.loc,true);});
if('serviceWorker' in navigator&&location.protocol==='https:')addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
window.__terraza={shareImage,state:S,setVerdict,setPhrase,PHRASES,MOMENT,WORDS};
})();
</script>
